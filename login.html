<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CryptoVault Login</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#080b10;
padding:20px;
}

.auth-wrapper{
width:100%;
max-width:420px;
background:#11161d;
border:1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:40px;
box-shadow:0 20px 80px rgba(0,0,0,0.45);
position:relative;
overflow:hidden;
}

.auth-wrapper::before{
content:'';
position:absolute;
top:-120px;
right:-120px;
width:240px;
height:240px;
background:rgba(245,158,11,0.08);
border-radius:50%;
}

.auth-logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:30px;
justify-content:center;
}

.logo-circle{
width:48px;
height:48px;
border-radius:12px;
background:#f59e0b;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
color:#080b10;
}

.auth-logo h1{
font-size:28px;
font-weight:800;
color:white;
}

.auth-logo span{
color:#f59e0b;
}

.tabs{
display:flex;
background:#1a212c;
border-radius:12px;
padding:5px;
margin-bottom:30px;
}

.tab-btn{
flex:1;
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:transparent;
color:#aaa;
font-size:15px;
font-weight:600;
}

.tab-btn.active{
background:#f59e0b;
color:#080b10;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-size:14px;
color:#ddd;
}

.form-group input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1b2330;
color:white;
font-size:15px;
}

.form-group input:focus{
outline:none;
border:1px solid #f59e0b;
}

.auth-btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#f59e0b;
color:#080b10;
font-size:16px;
font-weight:700;
cursor:pointer;
margin-top:10px;
transition:0.3s;
}

.auth-btn:hover{
transform:translateY(-2px);
}

.auth-footer{
margin-top:20px;
display:flex;
justify-content:space-between;
font-size:13px;
color:#aaa;
}

.auth-footer a{
color:#f59e0b;
text-decoration:none;
}

#message{
margin-top:18px;
text-align:center;
font-size:14px;
color:#22c55e;
}

.back-home{
display:block;
margin-top:30px;
text-align:center;
color:#aaa;
text-decoration:none;
font-size:14px;
}

.back-home:hover{
color:#f59e0b;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<div class="auth-wrapper">

<div class="auth-logo">
<div class="logo-circle">₿</div>
<h1>Crypto<span>Vault</span></h1>
</div>

<div class="tabs">
<button class="tab-btn active" id="loginTab">
Login
</button>

<button class="tab-btn" id="registerTab">
Register
</button>
</div>

<!-- LOGIN FORM -->

<div id="loginForm">

<div class="form-group">
<label>Email</label>
<input
type="email"
id="loginEmail"
placeholder="Enter your email"
>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
id="loginPassword"
placeholder="Enter your password"
>
</div>

<button class="auth-btn" id="loginBtn">
Login To Dashboard
</button>

<div class="auth-footer">
<label>
<input type="checkbox">
Remember me
</label>

<a href="#">
Forgot Password?
</a>
</div>

</div>

<!-- REGISTER FORM -->

<div id="registerForm" class="hidden">

<div class="form-group">
<label>Email</label>
<input
type="email"
id="registerEmail"
placeholder="Enter your email"
>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
id="registerPassword"
placeholder="Create password"
>
</div>

<button class="auth-btn" id="registerBtn">
Create Account
</button>

</div>

<p id="message"></p>

<a href="index.html" class="back-home">
← Back to Home
</a>

</div>

<script>

const supabaseUrl =
'https://fwgqydxkdbuzrehqifjw.supabase.co';

const supabaseKey =
'sb_publishable_Pbn_Z0wwsqMUyLWYg3udmQ_MC-Qz1kj';

const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);

const loginTab =
document.getElementById('loginTab');

const registerTab =
document.getElementById('registerTab');

const loginForm =
document.getElementById('loginForm');

const registerForm =
document.getElementById('registerForm');

loginTab.addEventListener('click', () => {

loginTab.classList.add('active');
registerTab.classList.remove('active');

loginForm.classList.remove('hidden');
registerForm.classList.add('hidden');

});

registerTab.addEventListener('click', () => {

registerTab.classList.add('active');
loginTab.classList.remove('active');

registerForm.classList.remove('hidden');
loginForm.classList.add('hidden');

});

document.getElementById('registerBtn')
.addEventListener('click', async () => {

const email =
document.getElementById('registerEmail').value;

const password =
document.getElementById('registerPassword').value;

const { data,error } =
await supabaseClient.auth.signUp({
email,
password
});

if(error){

document.getElementById('message').innerText =
error.message;

}else{

document.getElementById('message').innerText =
'Account Created Successfully';

}

});

document.getElementById('loginBtn')
.addEventListener('click', async () => {

const email =
document.getElementById('loginEmail').value;

const password =
document.getElementById('loginPassword').value;

const { data,error } =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

document.getElementById('message').innerText =
error.message;

}else{

window.location.href =
'dashboard.html';

}

});

</script>

</body>

</html>
