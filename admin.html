<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoVault Admin</title>
    <link rel="stylesheet" href="admin.css">
    <script>
        window.CRYPTOVAULT_SUPABASE_URL = "https://fwgqydxkdbuzrehqifjw.supabase.co";
        window.CRYPTOVAULT_SUPABASE_KEY = "sb_publishable_Pbn_Z0wwsqMUyLWYg3udmQ_MC-Qz1kj";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>


</head>
<body>
    <div id="adminLoginScreen" class="login-screen">
        <div class="login-box">
            <h1>🔐 CryptoVault Admin</h1>
            <form id="adminLoginForm">
                <input type="email" id="adminLoginEmail" placeholder="Admin Email" required>
                <input type="password" id="adminLoginPassword" placeholder="Password" required>
                <button type="submit" id="adminLoginBtn" class="btn-primary">Sign In</button>
            </form>
            <p id="adminLoginError" class="error-msg"></p>
        </div>
    </div>

    <div id="adminAppShell" class="admin-app hidden">
        <aside class="sidebar" id="adminSidebar">
            <div class="logo">🔐 CryptoVault Admin</div>
            <nav>
                <a href="#" class="nav-link active" data-admin-tab="deposits">📋 Deposits
                    <span id="sidebarDepositBadge"></span>
                </a>
                <a href="#" class="nav-link" data-admin-tab="users">👤 Users</a>
                <a href="#" class="nav-link" data-admin-tab="notifications">🔔 Notifications</a>
            </nav>
            <div class="sidebar-footer">
                <span id="adminUserEmail"></span>
                <button class="btn-logout" data-admin-logout>Logout</button>
            </div>
        </aside>
        <div id="adminSidebarOverlay"></div>

        <main class="main-content">
            <header class="topbar">
                <h2 id="adminPageTitle">Admin Dashboard</h2>
            </header>

            <div data-admin-section="deposits" class="tab-content active">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Deposits</div>
                        <div class="stat-value" id="stat-total">0</div>
                    </div>
                    <div class="stat-card pending">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" id="depositCountPending">0</div>
                    </div>
                    <div class="stat-card approved">
                        <div class="stat-label">Approved</div>
                        <div class="stat-value" id="depositCountApproved">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Users</div>
                        <div class="stat-value" id="stat-users">0</div>
                    </div>
                </div>

                <div class="filters">
                    <select id="depositStatusFilter">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="approved">Approved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                    <input type="text" id="depositSearchInput" placeholder="Search email, coin, tx hash...">
                </div>

                <div class="table-container" id="depositsTableWrap">
                    <!-- populated by JS -->
                </div>
            </div>

            <div data-admin-section="users" class="tab-content">
                <div class="filters">
                    <input type="text" id="userSearchInput" placeholder="Search users...">
                </div>
                <div class="table-container" id="usersTableWrap">
                    <!-- populated by JS -->
                </div>
            </div>

            <div data-admin-section="notifications" class="tab-content">
                <div class="grid-2">
                    <div class="card">
                        <div class="card-header"><div class="card-title">Send Notification</div></div>
                        <div class="notif-form">
                            <div class="form-group">
                                <label>Target</label>
                                <select id="notifTarget">
                                    <option value="all">All Users</option>
                                    <option value="specific">Specific User</option>
                                </select>
                            </div>
                            <div class="form-group" id="notifUserGroup" style="display:none;">
                                <label>User Email</label>
                                <input type="email" id="notifUserEmail" placeholder="user@example.com">
                            </div>
                            <div class="form-group">
                                <label>Title</label>
                                <input type="text" id="notifTitle" placeholder="Notification title">
                            </div>
                            <div class="form-group">
                                <label>Message</label>
                                <textarea id="notifMessage" rows="3" placeholder="Message content..."></textarea>
                            </div>
                            <div class="form-group">
                                <label>Type</label>
                                <select id="notifType">
                                    <option value="info">Info</option>
                                    <option value="success">Success</option>
                                    <option value="warning">Warning</option>
                                    <option value="error">Error</option>
                                    <option value="announcement">Announcement</option>
                                </select>
                            </div>
                            <button class="admin-btn admin-btn-primary" id="sendNotifBtn">📤 Send Notification</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-header"><div class="card-title">Recent Notifications</div></div>
                        <div id="adminNotifTableWrap"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>
    <div id="lightbox" class="lightbox hidden">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Screenshot">
    </div>

    <script src="admin.js"></script>
</body>
</html>
