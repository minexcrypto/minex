<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MineX Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.container{
background:#10172d;
padding:40px;
width:400px;
border-radius:20px;
text-align:center;
}

h1{
margin-bottom:30px;
color:orange;
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
border:none;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:10px;
background:orange;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#message{
margin-top:20px;
color:#00ff99;
}

</style>

</head>

<body>

<div class="container">

<h1>MineX Account</h1>

<input
type="email"
id="email"
placeholder="Enter Email"
>

<input
type="password"
id="password"
placeholder="Enter Password"
>

<button id="signupBtn">
Create Account
</button>

<button id="loginBtn">
Login
</button>

<p id="message"></p>

</div>

<script>

const supabaseUrl =
'https://fwgqydxkdbuzrehqifjw.supabase.co';

const supabaseKey =
'sb_publishable_Pbn_Z0wwsqMUyLWYg3udmQ_MC-Qz1kj';

const supabaseClient =
supabase.createClient(
supabaseUrl,
supabaseKey
);

const signupBtn =
document.getElementById('signupBtn');

const loginBtn =
document.getElementById('loginBtn');

signupBtn.addEventListener('click', async () => {

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

const { data,error } =
await supabaseClient.auth.signUp({
email,
password
});

if(error){

document.getElementById('message').innerText =
error.message;

}else{

document.getElementById('message').innerText =
'Account Created Successfully';

}

});

loginBtn.addEventListener('click', async () => {

const email =
document.getElementById('email').value;

const password =
document.getElementById('password').value;

const { data,error } =
await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error){

document.getElementById('message').innerText =
error.message;

}else{

document.getElementById('message').innerText =
'Login Successful';

}

});

</script>

</body>

</html>
