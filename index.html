<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MineX Crypto Mining</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 80px;
background:#0b1023;
}

.logo{
font-size:30px;
font-weight:bold;
color:orange;
}

.hero{
height:90vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.hero h1{
font-size:70px;
max-width:900px;
line-height:1.2;
}

.hero p{
margin-top:20px;
font-size:22px;
color:#bdbdbd;
max-width:700px;
}

.hero button{
margin-top:40px;
padding:18px 45px;
background:orange;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.stats{
display:flex;
justify-content:center;
gap:30px;
padding:60px 20px;
flex-wrap:wrap;
}

.box{
background:#10172d;
padding:35px;
width:260px;
border-radius:20px;
text-align:center;
}

.box h1{
color:orange;
margin-bottom:10px;
font-size:40px;
}

.box p{
color:#bdbdbd;
}

</style>

</head>

<body>

<header>

<div class="logo">
MineX
</div>

</header>

<section class="hero">

<h1>
Modern Bitcoin Cloud Mining Platform
</h1>

<p>
Secure cloud mining infrastructure with real-time crypto analytics.
</p>

<button>
Start Mining
</button>

</section>

<section class="stats">

<div class="box">
<h1 id="btc-price">$0</h1>
<p>Bitcoin Price</p>
</div>

<div class="box">
<h1>125K+</h1>
<p>Active Miners</p>
</div>

<div class="box">
<h1>4.8/5</h1>
<p>User Rating</p>
</div>

</section>

<script>

async function loadBTCPrice(){

try{

const response = await fetch(
'https://api.coindesk.com/v1/bpi/currentprice.json'
);

const data = await response.json();

document.getElementById('btc-price').innerText =
'$' + Math.floor(data.bpi.USD.rate_float);

}catch(error){

document.getElementById('btc-price').innerText =
'$109000';

}

}

loadBTCPrice();

setInterval(loadBTCPrice,60000);

</script>

</body>

</html>
