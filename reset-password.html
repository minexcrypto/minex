<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - CryptoVault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080b10;
    padding: 20px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    margin: 0;
    color: #fff;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #11161d;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.45);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  p {
    margin: 0 0 20px;
    color: #94a3b8;
    font-size: 14px;
  }
  .form-group { margin-bottom: 14px; }
  label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    color: #ddd;
  }
  input {
    width: 100%;
    padding: 14px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: #1b2330;
    color: white;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
  }
  input:focus { border-color: #f59e0b; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #f59e0b;
    color: #080b10;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .back {
    display: block;
    margin-top: 16px;
    text-align: center;
    color: #94a3b8;
    text-decoration: none;
  }
  .back:hover { color: #f59e0b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Enter your new password below to finish account recovery.</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="password">New Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" minlength="6" required>
      </div>
      <button type="submit" id="updateBtn">Update Password</button>
    </form>

    <a class="back" href="login.html">Back to Login</a>
  </div>

<script>
  const SUPABASE_URL = 'https://fwgqydxkdbuzrehqifjw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Pbn_Z0wwsqMUyLWYg3udmQ_MC-Qz1kj';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('resetForm');
  const updateBtn = document.getElementById('updateBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (password !== confirm) {
      alert('Passwords do not match');
      return;
    }

    if (password.length < 6) {
      alert('Password must be at least 6 characters.');
      return;
    }

    try {
      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating...';

      const { error } = await _supabase.auth.updateUser({ password });
      if (error) throw error;

      alert('Password updated successfully.');
      window.location.href = 'login.html';
    } catch (err) {
      alert(err.message || 'Failed to update password.');
    } finally {
      updateBtn.disabled = false;
      updateBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
